<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flik Tide - Free Learning & Video Platform</title>
  
  <!-- Base & Layout CSS -->
  <link rel="stylesheet" href="assets/css/base/reset.css">
  <link rel="stylesheet" href="assets/css/base/variables.css">
  <link rel="stylesheet" href="assets/css/base/layout.css">
  <link rel="stylesheet" href="assets/css/themes/dark.css">
  
  <!-- Component & Page CSS -->
  <link rel="stylesheet" href="assets/css/components/header.css">
  <link rel="stylesheet" href="assets/css/components/sidebar.css">
  <link rel="stylesheet" href="assets/css/components/video-card.css">
  <link rel="stylesheet" href="assets/css/pages/home.css">
</head>
<body class="dark-theme">

  <!-- Header Navigation -->
  <header class="main-header">
    <div class="logo-container">
      <img src="public/icons/logo.svg" alt="Flik Tide Logo" class="app-logo">
      <span class="brand-name">Flik Tide</span>
    </div>
    
    <div class="search-bar-wrapper">
      <input type="text" id="searchInput" placeholder="ভিডিও খুঁজুন...">
      <button id="searchBtn">
        <img src="public/icons/search.svg" alt="Search">
      </button>
    </div>

    <div class="user-actions">
      <!-- Admin Upload Button (Hidden for general users) -->
      <a href="watch.html" class="nav-link">সব ভিডিও</a>
    </div>
  </header>

  <div class="app-container">
    <!-- Sidebar -->
    <aside class="sidebar">
      <nav class="nav-menu">
        <a href="index.html" class="nav-item active">
          <img src="public/icons/home.svg" alt="Home">
          <span>হোম</span>
        </a>
        <a href="shorts.html" class="nav-item">
          <img src="public/icons/shorts.svg" alt="Shorts">
          <span>শর্টস</span>
        </a>
        <a href="explore.html" class="nav-item">
          <img src="public/icons/library.svg" alt="Explore">
          <span>এক্সপ্লোর</span>
        </a>
      </nav>
    </aside>

    <!-- Main Video Feed -->
    <main class="main-content">
      <!-- Category Filter Row -->
      <div class="category-bar">
        <button class="chip active">সব</button>
        <button class="chip">টিউটোরিয়াল</button>
        <button class="chip">কোর্স</button>
        <button class="chip">শর্টস</button>
      </div>

      <!-- Video Grid Container -->
      <div class="video-grid" id="videoGrid">
        <!-- JavaScript এর মাধ্যমে এখানে ভিডিও লোড হবে -->
      </div>
    </main>
  </div>

  <!-- Core & Feature Scripts -->
  <script src="assets/js/core/config.js"></script>
  <script src="assets/js/api/http.js"></script>
  <script src="assets/js/api/video-api.js"></script>
  <script src="assets/js/features/home/home-feed.js"></script>
  <script src="assets/js/features/home/home-init.js"></script>
</body>
</html>
