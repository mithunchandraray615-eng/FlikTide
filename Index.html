<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlikTide</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #0f0f0f;
            color: #fff;
        }

        .header {
            height: 64px;
            display: flex;
            align-items: center;
            padding: 0 20px;
            gap: 16px;
            border-bottom: 1px solid #272727;
            position: sticky;
            top: 0;
            background: #0f0f0f;
            z-index: 10;
        }

        .menu {
            font-size: 24px;
            background: none;
            border: 0;
            color: white;
            cursor: pointer;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 8px;
            color: white;
            text-decoration: none;
            font-size: 22px;
            font-weight: bold;
            white-space: nowrap;
        }

        .logo-icon {
            width: 34px;
            height: 24px;
            background: #ff0033;
            border-radius: 7px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logo-icon::after {
            content: "";
            border-top: 7px solid transparent;
            border-bottom: 7px solid transparent;
            border-left: 11px solid white;
        }

        .search {
            flex: 1;
            max-width: 600px;
            margin: auto;
            display: flex;
        }

        .search input {
            flex: 1;
            height: 42px;
            padding: 0 16px;
            border: 1px solid #303030;
            border-right: 0;
            border-radius: 22px 0 0 22px;
            background: #121212;
            color: white;
            outline: none;
            font-size: 16px;
        }

        .search button {
            width: 60px;
            border: 1px solid #303030;
            border-radius: 0 22px 22px 0;
            background: #222;
            color: white;
            cursor: pointer;
            font-size: 18px;
        }

        .login {
            text-decoration: none;
            color: #3ea6ff;
            border: 1px solid #3ea6ff;
            border-radius: 20px;
            padding: 10px 18px;
            font-weight: bold;
            white-space: nowrap;
        }

        .main {
            display: flex;
            min-height: calc(100vh - 64px);
        }

        .sidebar {
            width: 210px;
            padding: 18px 12px;
            border-right: 1px solid #272727;
        }

        .side-link {
            display: block;
            padding: 13px 16px;
            color: white;
            text-decoration: none;
            border-radius: 10px;
            margin-bottom: 4px;
        }

        .side-link:hover {
            background: #272727;
        }

        .content {
            flex: 1;
            text-align: center;
            padding: 80px 20px;
        }

        .hero-logo {
            width: 80px;
            height: 56px;
            margin: 0 auto 25px;
            background: #ff0033;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .hero-logo::after {
            content: "";
            border-top: 13px solid transparent;
            border-bottom: 13px solid transparent;
            border-left: 21px solid white;
        }

        h1 {
            font-size: 34px;
            margin-bottom: 14px;
        }

        p {
            color: #aaa;
            font-size: 16px;
            margin-bottom: 28px;
        }

        .big-login {
            display: inline-block;
            text-decoration: none;
            background: white;
            color: #111;
            padding: 14px 35px;
            border-radius: 25px;
            font-weight: bold;
            font-size: 17px;
        }

        .big-login:hover {
            background: #ddd;
        }

        @media (max-width: 700px) {
            .header {
                padding: 0 10px;
                gap: 8px;
            }

            .menu,
            .sidebar {
                display: none;
            }

            .logo {
                font-size: 18px;
            }

            .logo-icon {
                width: 29px;
                height: 21px;
            }

            .search {
                margin-left: 4px;
            }

            .search input {
                min-width: 0;
                font-size: 14px;
            }

            .search button {
                width: 48px;
            }

            .login {
                padding: 9px 12px;
                font-size: 13px;
            }

            .content {
                padding-top: 90px;
            }

            h1 {
                font-size: 27px;
            }
        }
    </style>
</head>

<body>

    <header class="header">
        <button class="menu" type="button">☰</button>

        <a href="Index.html" class="logo">
            <span class="logo-icon"></span>
            FlikTide
        </a>

        <div class="search">
            <input type="text" placeholder="Search">
            <button type="button">🔍</button>
        </div>

        <a href="../Login/Signup.html" class="login">Login</a>
    </header>

    <main class="main">

        <aside class="sidebar">
            <a href="#" class="side-link">⌂ &nbsp; Home</a>
            <a href="#" class="side-link">▶ &nbsp; Videos</a>
            <a href="#" class="side-link">★ &nbsp; Trending</a>
        </aside>

        <section class="content">
            <div class="hero-logo"></div>

            <h1>Welcome to FlikTide</h1>

            <p>
                Sign in to your FlikTide account
                and enjoy your video experience.
            </p>

            <a href="../Login/Signup.html" class="big-login">
                Login
            </a>
        </section>

    </main>

</body>
</html>
