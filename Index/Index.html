<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>FlikTide</title>

    <style>

        /* =========================
           RESET
        ========================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #0f0f0f;
            color: #ffffff;
        }


        /* =========================
           HEADER
        ========================= */

        .header {
            height: 64px;
            width: 100%;

            display: flex;
            align-items: center;

            padding: 0 20px;

            background: #0f0f0f;

            border-bottom: 1px solid #272727;

            position: sticky;
            top: 0;

            z-index: 1000;
        }


        /* MENU BUTTON */

        .menu-btn {
            width: 42px;
            height: 42px;

            border: none;
            border-radius: 50%;

            background: transparent;
            color: white;

            font-size: 25px;

            cursor: pointer;

            margin-right: 10px;
        }

        .menu-btn:hover {
            background: #272727;
        }


        /* =========================
           LOGO
        ========================= */

        .logo {
            display: flex;
            align-items: center;

            text-decoration: none;

            color: white;

            font-size: 23px;
            font-weight: bold;

            white-space: nowrap;
        }

        .logo-icon {
            width: 34px;
            height: 24px;

            background: #ff0033;

            border-radius: 7px;

            display: flex;
            align-items: center;
            justify-content: center;

            margin-right: 7px;

            position: relative;
        }

        .logo-icon::after {
            content: "";

            width: 0;
            height: 0;

            border-top: 7px solid transparent;
            border-bottom: 7px solid transparent;
            border-left: 11px solid white;

            margin-left: 3px;
        }

        .logo span {
            color: white;
        }


        /* =========================
           SEARCH
        ========================= */

        .search-area {
            flex: 1;

            display: flex;
            justify-content: center;

            margin: 0 25px;
        }

        .search-box {
            width: 100%;
            max-width: 600px;

            height: 42px;

            display: flex;
        }

        .search-input {
            flex: 1;

            height: 42px;

            background: #121212;

            border: 1px solid #303030;

            border-right: none;

            border-radius: 22px 0 0 22px;

            padding: 0 18px;

            color: white;

            font-size: 16px;

            outline: none;
        }

        .search-input:focus {
            border-color: #3ea6ff;
        }

        .search-input::placeholder {
            color: #aaa;
        }

        .search-btn {
            width: 65px;

            border: 1px solid #303030;

            background: #222222;

            color: white;

            border-radius: 0 22px 22px 0;

            font-size: 19px;

            cursor: pointer;
        }

        .search-btn:hover {
            background: #303030;
        }


        /* =========================
           LOGIN
        ========================= */

        .login-btn {
            display: flex;
            align-items: center;
            justify-content: center;

            min-width: 95px;
            height: 40px;

            padding: 0 16px;

            border: 1px solid #3ea6ff;

            border-radius: 20px;

            color: #3ea6ff;

            text-decoration: none;

            font-size: 15px;
            font-weight: bold;

            transition: 0.2s;
        }

        .login-btn:hover {
            background: #263b4d;
        }


        /* =========================
           MAIN
        ========================= */

        .main {
            min-height: calc(100vh - 64px);

            display: flex;
        }


        /* =========================
           SIDEBAR
        ========================= */

        .sidebar {
            width: 220px;

            padding: 18px 12px;

            border-right: 1px solid #272727;

            min-height: calc(100vh - 64px);
        }

        .side-item {
            width: 100%;

            height: 45px;

            display: flex;
            align-items: center;

            padding: 0 16px;

            margin-bottom: 4px;

            border-radius: 10px;

            color: white;

            text-decoration: none;

            font-size: 15px;
        }

        .side-item:hover {
            background: #272727;
        }

        .side-icon {
            width: 28px;

            font-size: 20px;

            margin-right: 10px;
        }


        /* =========================
           CONTENT
        ========================= */

        .content {
            flex: 1;

            padding: 30px;
        }


        /* =========================
           LOGIN HERO
        ========================= */

        .hero {
            max-width: 900px;

            margin: 60px auto;

            text-align: center;
        }

        .hero-logo {
            width: 85px;
            height: 60px;

            background: #ff0033;

            border-radius: 17px;

            margin: 0 auto 25px;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .hero-logo::after {
            content: "";

            width: 0;
            height: 0;

            border-top: 14px solid transparent;
            border-bottom: 14px solid transparent;
            border-left: 22px solid white;

            margin-left: 5px;
        }

        .hero h1 {
            font-size: 34px;

            margin-bottom: 15px;
        }

        .hero p {
            color: #aaaaaa;

            font-size: 17px;

            line-height: 1.6;

            max-width: 600px;

            margin: 0 auto 30px;
        }


        /* =========================
           BIG LOGIN BUTTON
        ========================= */

        .big-login {
            display: inline-flex;

            align-items: center;
            justify-content: center;

            min-width: 180px;
            height: 50px;

            padding: 0 28px;

            background: #ffffff;

            color: #111111;

            border-radius: 25px;

            text-decoration: none;

            font-size: 17px;

            font-weight: bold;

            transition: 0.2s;
        }

        .big-login:hover {
            background: #dddddd;

            transform: translateY(-2px);
        }

        .big-login:active {
            transform: scale(0.97);
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 700px) {

            .header {
                padding: 0 10px;
            }

            .menu-btn {
                display: none;
            }

            .logo {
                font-size: 19px;
            }

            .logo-icon {
                width: 30px;
                height: 21px;
            }

            .search-area {
                margin: 0 8px;
            }

            .search-input {
                font-size: 14px;
            }

            .search-btn {
                width: 48px;
            }

            .login-btn {
                min-width: 75px;
                height: 36px;

                padding: 0 12px;

                font-size: 13px;
            }

            .sidebar {
                display: none;
            }

            .content {
                padding: 20px 15px;
            }

            .hero {
                margin: 80px auto 40px;
            }

            .hero h1 {
                font-size: 28px;
            }

            .hero p {
                font-size: 15px;
            }
        }

    </style>
</head>


<body>


    <!-- =========================
         HEADER
    ========================== -->

    <header class="header">

        <!-- Menu -->
        <button class="menu-btn">
            ☰
        </button>


        <!-- FlikTide Logo -->
        <a href="Index.html" class="logo">

            <div class="logo-icon"></div>

            <span>FlikTide</span>

        </a>


        <!-- Search -->
        <div class="search-area">

            <div class="search-box">

                <input
                    type="text"
                    class="search-input"
                    placeholder="Search"
                    aria-label="Search"
                >

                <button
                    class="search-btn"
                    type="button"
                    aria-label="Search">
                    🔍
                </button>

            </div>

        </div>


        <!-- Login -->
        <a
            href="../Login/Signup.html"
            class="login-btn">

            Login

        </a>

    </header>



    <!-- =========================
         MAIN
    ========================== -->

    <main class="main">


        <!-- SIDEBAR -->

        <aside class="sidebar">

            <a href="#" class="side-item">
                <span class="side-icon">⌂</span>
                Home
            </a>

            <a href="#" class="side-item">
                <span class="side-icon">▶</span>
                Videos
            </a>

            <a href="#" class="side-item">
                <span class="side-icon">★</span>
                Trending
            </a>

        </aside>



        <!-- CONTENT -->

        <section class="content">


            <!-- LOGIN HERO -->

            <div class="hero">

                <div class="hero-logo"></div>

                <h1>
                    Welcome to FlikTide
                </h1>

                <p>
                    Sign in to your FlikTide account
                    and enjoy your personalized video
                    experience.
                </p>

                <a
                    href="../Login/Signup.html"
                    class="big-login">

                    Login

                </a>

            </div>


        </section>

    </main>



</body>
</html>
