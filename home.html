<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0,
                   maximum-scale=1.0, user-scalable=no">

    <title>FlickTide - Home</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <!-- =========================
         HOME PAGE
    ========================== -->

    <main class="home-page">

        <!-- =========================
             TOP HEADER
        ========================== -->

        <header class="home-header">

            <!-- Profile -->
            <button class="header-profile"
                    type="button"
                    aria-label="Profile"
                    onclick="location.href='profile.html'">

                <div class="profile-avatar">
                    <span>U</span>
                </div>

            </button>


            <!-- Page Title -->
            <div class="header-title">
                <h1>Home</h1>
            </div>


            <!-- Notification -->
            <button class="notification-button"
                    type="button"
                    aria-label="Notifications"
                    onclick="location.href='notifications.html'">

                <span class="notification-icon">♧</span>
                <span class="notification-dot"></span>

            </button>

        </header>


        <!-- =========================
             SEARCH
        ========================== -->

        <section class="home-search">

            <form class="search-form"
                  onsubmit="return false;">

                <span class="search-icon">⌕</span>

                <input
                    type="search"
                    id="homeSearch"
                    placeholder="Search"
                    autocomplete="off"
                    aria-label="Search"
                >

            </form>

        </section>


        <!-- =========================
             CONTINUE WATCHING
        ========================== -->

        <section class="home-section">

            <div class="section-header">

                <h2>Continue Watching</h2>

                <button type="button"
                        class="see-all-button">
                    See All
                </button>

            </div>


            <div class="horizontal-video-list">

                <!-- Video Card 01 -->

                <article class="video-card"
                         data-video-id="video-001">

                    <button class="video-thumbnail"
                            type="button"
                            aria-label="Play video">

                        <div class="thumbnail-placeholder">
                            <span class="play-icon">▶</span>
                        </div>

                        <span class="video-duration">
                            2:35
                        </span>

                        <div class="progress-bar">
                            <span style="width: 42%;"></span>
                        </div>

                    </button>

                    <div class="video-info">

                        <h3>
                            Intro to Fractions
                        </h3>

                        <p>
                            7 hours ago
                        </p>

                    </div>

                </article>


                <!-- Video Card 02 -->

                <article class="video-card"
                         data-video-id="video-002">

                    <button class="video-thumbnail"
                            type="button"
                            aria-label="Play video">

                        <div class="thumbnail-placeholder">
                            <span class="play-icon">▶</span>
                        </div>

                        <span class="video-duration">
                            8:12
                        </span>

                        <div class="progress-bar">
                            <span style="width: 25%;"></span>
                        </div>

                    </button>

                    <div class="video-info">

                        <h3>
                            Newton's Laws
                        </h3>

                        <p>
                            1 hour ago
                        </p>

                    </div>

                </article>

            </div>

        </section>


        <!-- =========================
             RECOMMENDED FOR YOU
        ========================== -->

        <section class="home-section">

            <div class="section-header">

                <h2>Recommended for You</h2>

                <button type="button"
                        class="see-all-button">
                    See All
                </button>

            </div>


            <div class="horizontal-content-list">

                <!-- Recommended Card -->

                <article class="content-card"
                         data-content-id="recommended-001">

                    <button class="content-image"
                            type="button"
                            aria-label="Open Science Experiments">

                        <div class="content-placeholder">
                            <span>🧪</span>
                        </div>

                    </button>

                    <div class="content-info">

                        <h3>
                            Science Experiments
                        </h3>

                        <p>
                            7 hours ago
                        </p>

                    </div>

                </article>


                <!-- Recommended Card -->

                <article class="content-card"
                         data-content-id="recommended-002">

                    <button class="content-image"
                            type="button"
                            aria-label="Open World History">

                        <div class="content-placeholder">
                            <span>🌍</span>
                        </div>

                    </button>

                    <div class="content-info">

                        <h3>
                            World History
                        </h3>

                        <p>
                            1 hour ago
                        </p>

                    </div>

                </article>


                <!-- Recommended Card -->

                <article class="content-card"
                         data-content-id="recommended-003">

                    <button class="content-image"
                            type="button"
                            aria-label="Open Science">

                        <div class="content-placeholder">
                            <span>🔬</span>
                        </div>

                    </button>

                    <div class="content-info">

                        <h3>
                            Science Basics
                        </h3>

                        <p>
                            2 hours ago
                        </p>

                    </div>

                </article>

            </div>

        </section>


        <!-- =========================
             NEW FROM YOUR TEACHERS
        ========================== -->

        <section class="home-section">

            <div class="section-header">

                <h2>New from Your Teachers</h2>

                <button type="button"
                        class="see-all-button">
                    See All
                </button>

            </div>


            <div class="horizontal-teacher-list">

                <!-- Teacher Content 01 -->

                <article class="teacher-content-card">

                    <button class="teacher-thumbnail"
                            type="button"
                            aria-label="Teacher content">

                        <div class="teacher-placeholder">
                            <span>👨‍🏫</span>
                        </div>

                    </button>

                    <div class="teacher-content-info">

                        <h3>
                            Mathematics
                        </h3>

                        <p>
                            Teacher
                        </p>

                    </div>

                </article>


                <!-- Teacher Content 02 -->

                <article class="teacher-content-card">

                    <button class="teacher-thumbnail"
                            type="button"
                            aria-label="Teacher content">

                        <div class="teacher-placeholder">
                            <span>👩‍🏫</span>
                        </div>

                    </button>

                    <div class="teacher-content-info">

                        <h3>
                            Science
                        </h3>

                        <p>
                            Teacher
                        </p>

                    </div>

                </article>


                <!-- Teacher Content 03 -->

                <article class="teacher-content-card">

                    <button class="teacher-thumbnail"
                            type="button"
                            aria-label="Teacher content">

                        <div class="teacher-placeholder">
                            <span>👨‍🏫</span>
                        </div>

                    </button>

                    <div class="teacher-content-info">

                        <h3>
                            English
                        </h3>

                        <p>
                            Teacher
                        </p>

                    </div>

                </article>

            </div>

        </section>


        <!-- =========================
             BOTTOM NAVIGATION
        ========================== -->

        <nav class="bottom-navigation"
             aria-label="Main navigation">

            <!-- Home -->

            <button class="bottom-nav-item active"
                    type="button"
                    onclick="location.href='home.html'">

                <span class="nav-icon">⌂</span>
                <span class="nav-label">Home</span>

            </button>


            <!-- Explore -->

            <button class="bottom-nav-item"
                    type="button"
                    onclick="location.href='explore.html'">

                <span class="nav-icon">⌕</span>
                <span class="nav-label">Explore</span>

            </button>


            <!-- Library -->

            <button class="bottom-nav-item"
                    type="button"
                    onclick="location.href='library.html'">

                <span class="nav-icon">▣</span>
                <span class="nav-label">My Library</span>

            </button>


            <!-- Profile -->

            <button class="bottom-nav-item"
                    type="button"
                    onclick="location.href='profile.html'">

                <span class="nav-icon">♙</span>
                <span class="nav-label">Profile</span>

            </button>

        </nav>

    </main>


    <!-- =========================
         HOME JAVASCRIPT
         Logic will be moved to
         separate JS files later.
    ========================== -->

    <script>
        /*
         * Home page structure only.
         *
         * Video feed logic:
         *     future: js/home-feed.js
         *
         * Video player:
         *     future: js/video-player.js
         *
         * Recommendations:
         *     future: js/recommendations.js
         *
         * Search:
         *     future: js/search.js
         *
         * Authentication:
         *     future: js/auth.js
         */
    </script>

</body>
</html>
