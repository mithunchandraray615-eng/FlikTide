<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
               maximum-scale=1.0,user-scalable=no">

<title>FlikTide</title>

<style>
/* =========================================================
   FLIKTIDE — FOUNDATION
   ========================================================= */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

:root {
    --bg: #f5f7fb;
    --surface: #ffffff;
    --surface2: #eef1f7;
    --text: #111827;
    --muted: #687386;
    --border: #dfe4ec;
    --primary: #2563eb;
    --primary2: #4f46e5;
    --orange: #f97316;
    --danger: #ef4444;
    --shadow: 0 8px 25px rgba(0,0,0,.08);
}

body.dark {
    --bg: #0d1628;
    --surface: #111b2e;
    --surface2: #1a263b;
    --text: #f8fafc;
    --muted: #9aa6ba;
    --border: #243149;
    --shadow: 0 8px 25px rgba(0,0,0,.25);
}

body {
    font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Noto Sans Bengali",
        "Segoe UI",
        sans-serif;

    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding-bottom: 78px;
    transition: .2s;
}

/* =========================================================
   HEADER
   ========================================================= */

.header {
    height: 74px;
    position: sticky;
    top: 0;
    z-index: 1000;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 10px 16px;

    background: var(--surface);
    border-bottom: 1px solid var(--border);
}

.brand {
    display: flex;
    align-items: center;
    gap: 12px;
}

.logo {
    width: 48px;
    height: 48px;

    border-radius: 15px;

    display: flex;
    align-items: center;
    justify-content: center;

    color: white;
    font-weight: 900;
    font-size: 19px;

    background:
        linear-gradient(135deg,#4f46e5,#7c3aed,#f97316);
}

.brand-name {
    font-size: 25px;
    font-weight: 900;
}

.brand-name span {
    color: var(--orange);
}

.header-actions {
    display: flex;
    align-items: center;
    gap: 8px;
}

.icon-btn {
    width: 48px;
    height: 48px;

    border: none;
    border-radius: 15px;

    background: var(--surface2);
    color: var(--text);

    font-size: 22px;
    cursor: pointer;
}

.icon-btn:active {
    transform: scale(.94);
}

.header-avatar {
    width: 48px;
    height: 48px;
    border-radius: 50%;

    display: flex;
    align-items: center;
    justify-content: center;

    color: white;
    font-weight: 800;
    font-size: 18px;

    background:
        linear-gradient(135deg,#2563eb,#7c3aed);
}

/* =========================================================
   PAGE
   ========================================================= */

.page {
    display: none;
    max-width: 1000px;
    margin: auto;
    padding: 20px 16px;
}

.page.active {
    display: block;
}

.page-title {
    font-size: 28px;
    font-weight: 900;
    margin-bottom: 18px;
}

.back-row {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 18px;
}

.back-btn {
    width: 44px;
    height: 44px;

    border: none;
    border-radius: 13px;

    background: var(--surface2);
    color: var(--text);

    font-size: 25px;
    cursor: pointer;
}

.back-title {
    font-size: 20px;
    font-weight: 800;
}

/* =========================================================
   SEARCH
   ========================================================= */

.search-box {
    display: flex;
    align-items: center;
    gap: 10px;

    background: var(--surface);
    border: 1px solid var(--border);

    border-radius: 20px;

    padding: 14px 16px;
    margin-bottom: 22px;
}

.search-box span {
    font-size: 22px;
}

.search-box input {
    flex: 1;
    border: none;
    outline: none;

    background: transparent;
    color: var(--text);

    font-size: 17px;
}

/* =========================================================
   CONTENT CARDS
   ========================================================= */

.card-grid {
    display: grid;
    grid-template-columns: repeat(2,1fr);
    gap: 18px;
}

.content-card {
    overflow: hidden;

    background: var(--surface);
    border: 1px solid var(--border);

    border-radius: 22px;

    box-shadow: var(--shadow);

    cursor: pointer;
    transition: .2s;
}

.content-card:active {
    transform: scale(.98);
}

.thumbnail {
    height: 210px;

    display: flex;
    align-items: center;
    justify-content: center;

    background:
        linear-gradient(135deg,#e0e7ff,#fff7ed);

    font-size: 65px;
}

.card-info {
    padding: 16px;
}

.card-title {
    font-size: 20px;
    font-weight: 850;
    margin-bottom: 8px;
}

.card-meta {
    color: var(--muted);
    font-size: 15px;
}

/* =========================================================
   TEACHER
   ========================================================= */

.teacher-row {
    display: flex;
    align-items: center;
    gap: 10px;

    margin-top: 12px;
}

.teacher-logo {
    width: 40px;
    height: 40px;

    border-radius: 50%;

    display: flex;
    align-items: center;
    justify-content: center;

    background:
        linear-gradient(135deg,#2563eb,#7c3aed);

    color: white;
    font-weight: 800;

    overflow: hidden;
}

.teacher-logo img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.teacher-name {
    color: var(--primary);
    font-weight: 750;
    cursor: pointer;
}

/* =========================================================
   PROFILE
   ========================================================= */

.profile-card {
    overflow: hidden;

    background: var(--surface);

    border: 1px solid var(--border);

    border-radius: 28px;

    box-shadow: var(--shadow);
}

.cover {
    height: 220px;

    background:
        linear-gradient(
            135deg,
            #2563eb,
            #7c3aed,
            #f97316
        );

    background-size: cover;
    background-position: center;

    position: relative;
}

.cover-edit {
    position: absolute;
    right: 14px;
    bottom: 14px;

    border: none;
    border-radius: 12px;

    padding: 10px 14px;

    background: rgba(0,0,0,.55);
    color: white;

    cursor: pointer;
}

.profile-body {
    padding: 0 24px 28px;
}

.profile-avatar {
    width: 140px;
    height: 140px;

    margin-top: -70px;

    position: relative;

    border-radius: 50%;

    border: 6px solid var(--surface);

    display: flex;
    align-items: center;
    justify-content: center;

    overflow: hidden;

    background:
        linear-gradient(135deg,#2563eb,#7c3aed);

    color: white;

    font-size: 52px;
    font-weight: 900;
}

.profile-avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.profile-name {
    font-size: 34px;
    font-weight: 900;
    margin-top: 18px;
}

.profile-phone {
    color: var(--muted);
    font-size: 20px;
    margin-top: 6px;
}

.badge {
    display: inline-block;

    margin-top: 14px;

    padding: 10px 18px;

    background: var(--surface2);

    border-radius: 30px;

    color: var(--text);

    font-weight: 700;
}

.edit-btn {
    margin-top: 18px;

    border: none;
    border-radius: 15px;

    padding: 14px 22px;

    background: var(--primary);
    color: white;

    font-size: 17px;
    font-weight: 800;

    cursor: pointer;
}

.profile-details {
    margin-top: 25px;

    display: grid;
    gap: 10px;
}

.detail {
    padding: 15px;

    background: var(--surface2);

    border-radius: 15px;
}

.detail strong {
    display: block;
    margin-bottom: 4px;
}

/* =========================================================
   STATS
   ========================================================= */

.stats {
    display: grid;
    grid-template-columns: repeat(3,1fr);
    gap: 10px;

    margin-top: 20px;
}

.stat {
    background: var(--surface2);
    padding: 16px;
    text-align: center;
    border-radius: 15px;
}

.stat-number {
    font-size: 22px;
    font-weight: 900;
}

/* =========================================================
   BOTTOM NAV
   ========================================================= */

.bottom-nav {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;

    height: 76px;

    display: grid;
    grid-template-columns: repeat(5,1fr);

    background: var(--surface);

    border-top: 1px solid var(--border);

    z-index: 2000;
}

.nav-btn {
    border: none;
    background: transparent;

    color: var(--muted);

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

    gap: 4px;

    font-size: 13px;

    cursor: pointer;
}

.nav-icon {
    font-size: 24px;
}

.nav-btn.active {
    color: var(--primary);
    font-weight: 800;
}

/* =========================================================
   MODAL
   ========================================================= */

.modal {
    display: none;

    position: fixed;
    inset: 0;

    background: rgba(0,0,0,.65);

    z-index: 5000;

    align-items: flex-end;
    justify-content: center;
}

.modal.show {
    display: flex;
}

.modal-box {
    width: 100%;
    max-width: 650px;

    max-height: 90vh;
    overflow-y: auto;

    background: var(--surface);

    border-radius: 25px 25px 0 0;

    padding: 22px;
}

.modal-title {
    font-size: 23px;
    font-weight: 900;
    margin-bottom: 18px;
}

.form-group {
    margin-bottom: 15px;
}

.form-group label {
    display: block;

    margin-bottom: 7px;

    font-weight: 700;
}

.form-group input,
.form-group textarea,
.form-group select {
    width: 100%;

    padding: 14px;

    border-radius: 13px;

    border: 1px solid var(--border);

    background: var(--surface2);
    color: var(--text);

    outline: none;

    font-size: 16px;
}

.form-actions {
    display: flex;
    gap: 10px;
    margin-top: 20px;
}

.primary-btn,
.secondary-btn,
.danger-btn {
    flex: 1;

    border: none;
    border-radius: 13px;

    padding: 14px;

    font-weight: 800;

    cursor: pointer;
}

.primary-btn {
    background: var(--primary);
    color: white;
}

.secondary-btn {
    background: var(--surface2);
    color: var(--text);
}

.danger-btn {
    background: var(--danger);
    color: white;
}

/* =========================================================
   LOGIN
   ========================================================= */

.auth-page {
    min-height: calc(100vh - 74px);

    display: flex;
    align-items: center;
    justify-content: center;

    padding: 20px;
}

.auth-box {
    width: 100%;
    max-width: 430px;

    background: var(--surface);

    border: 1px solid var(--border);

    border-radius: 25px;

    padding: 25px;

    box-shadow: var(--shadow);
}

.auth-logo {
    width: 75px;
    height: 75px;

    border-radius: 22px;

    display: flex;
    align-items: center;
    justify-content: center;

    margin: 0 auto 18px;

    background:
        linear-gradient(135deg,#2563eb,#7c3aed,#f97316);

    color: white;

    font-size: 25px;
    font-weight: 900;
}

.auth-title {
    text-align: center;
    font-size: 28px;
    font-weight: 900;
    margin-bottom: 8px;
}

.auth-subtitle {
    text-align: center;
    color: var(--muted);
    margin-bottom: 25px;
}

.auth-switch {
    margin-top: 18px;
    text-align: center;
    color: var(--primary);
    cursor: pointer;
    font-weight: 700;
}

/* =========================================================
   TEACHER PAGE
   ========================================================= */

.teacher-profile {
    padding: 22px;

    background: var(--surface);

    border: 1px solid var(--border);

    border-radius: 25px;

    margin-bottom: 20px;
}

.teacher-header {
    display: flex;
    align-items: center;
    gap: 15px;
}

.teacher-big-logo {
    width: 80px;
    height: 80px;

    border-radius: 50%;

    background:
        linear-gradient(135deg,#2563eb,#7c3aed);

    color: white;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 30px;
    font-weight: 900;

    overflow: hidden;
}

.teacher-big-logo img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

/* =========================================================
   EMPTY
   ========================================================= */

.empty {
    padding: 50px 20px;
    text-align: center;
    color: var(--muted);
}

.empty-icon {
    font-size: 55px;
    margin-bottom: 10px;
}

/* =========================================================
   RESPONSIVE
   ========================================================= */

@media (max-width: 650px) {

    .brand-name {
        font-size: 22px;
    }

    .header {
        padding: 10px 12px;
    }

    .card-grid {
        grid-template-columns: 1fr;
    }

    .thumbnail {
        height: 260px;
    }

    .profile-name {
        font-size: 30px;
    }

    .stats {
        grid-template-columns: 1fr 1fr 1fr;
    }
}

@media (max-width: 380px) {

    .brand-name {
        display: none;
    }

    .icon-btn {
        width: 43px;
        height: 43px;
    }

    .header-avatar {
        width: 43px;
        height: 43px;
    }
}
</style>
</head>

     HEADER

        <button

            M
        </button>

<!-- =======================================================
     HOME
     ======================================================= -->

<main
    id="home"
    class="page active">

            id="searchInput"

    </div>

</main>


<!-- =======================================================
     SHORTS
     ======================================================= -->

<main
    id="shorts"

<!-- =======================================================

</main>


<!-- =======================================================
     TEACHER PROFILE
     ======================================================= -->

<main
    id="teacherPage"
    class="page">

    <div class="back-row">

        <button
            class="back-btn"
            onclick="goBack()">
            ←
        </button>

            শিক্ষক

    </div>

        id="teacherProfileBox"

        এই শিক্ষকের Content

        id="teacherContent"
        class="card-grid">
    </div>

</main>


<!-- =======================================================
     CONTENT DETAIL
     ======================================================= -->

<main
    id="contentDetail"
    class="page">

    <div class="back-row">

        <button
            class="back-btn"
            onclick="goBack()">
            ←
        </button>

        <div class="back-title">
            Content
        </div>

    </div>

    <div
        id="detailBox">
    </div>

</main>


<!-- =======================================================
     BOTTOM NAVIGATION
     ======================================================= -->

<nav class="bottom-nav">

        class="nav-btn active"
        data-page="home"
        onclick="navigate('home')">

        <span>Home</span>

    </button>

    </button>

    <button
        class="nav-btn"
        data-page="library"
        onclick="navigate('library')">

        <span class="nav-icon">▣</span>

    </button>

    <button
        class="nav-btn"
        data-page="profile"
        onclick="navigate('profile')">

        <span class="nav-icon">♙</span>
        <span>Profile</span>

    </button>

</nav>


<!-- =======================================================
     EDIT PROFILE MODAL
     ======================================================= -->

<div
    id="editModal"
    class="modal">

    <div class="modal-box">

        <div class="modal-title">
            Edit Profile
        </div>

        <div class="form-group">

            <label>
                নাম
            </label>

            <input
                id="editName"
                type="text">

        </div>

        <div class="form-group">

                মোবাইল নাম্বার

        </div>

        <div class="form-group">

            <label>
                পরিচয়

            <select id="editRole">

                </option>

                <option value="Teacher">
                    Teacher

        </div>

            <label>
                Bio

                id="editBio"
                rows="4"
                placeholder="আপনার সম্পর্কে লিখুন...">
            </textarea>

        </div>

        <div class="form-group">

            <label>
                Profile Photo URL
            </label>

            <input
                id="editAvatar"
                type="url"
                placeholder="https://...">

        </div>

        <div class="form-group">

            <label>
                Cover Photo URL
            </label>

            <input
                id="editCover"
                type="url"
                placeholder="https://...">

        </div>

        <div class="form-actions">

            <button
                class="secondary-btn"
                onclick="closeEditProfile()">
                Cancel
            </button>

            <button
                class="primary-btn"
                onclick="saveProfile()">
                Save
            </button>

        </div>

    </div>

</div>

/* =========================================================
   STATE
   ========================================================= */

    JSON.parse(
        localStorage.getItem("fliktide_profile")

/* =========================================================

   ========================================================= */

function saveProfileData() {

    localStorage.setItem(
        "fliktide_profile",

/* =========================================================
   PROFILE RENDER
   ========================================================= */

function renderProfile() {

    document.getElementById("profileName")
        .textContent = profile.name;

    document.getElementById("profilePhone")
        .textContent = profile.phone;

    document.getElementById("profileRole")
        .textContent = profile.role;

    const avatar =
        document.getElementById("profileAvatar");

    const headerAvatar =
        document.getElementById("headerAvatar");


    if (profile.avatar) {

        avatar.innerHTML =
            `<img src="${escapeHTML(profile.avatar)}"
                  alt="Profile">`;

        headerAvatar.innerHTML =
            `<img src="${escapeHTML(profile.avatar)}"
                  style="width:100%;height:100%;object-fit:cover;border-radius:50%"
                  alt="Profile">`;

    } else {

        const letter =
            profile.name
                .trim()
                .charAt(0)
                .toUpperCase() || "M";

        avatar.textContent = letter;

        headerAvatar.textContent = letter;

    }


    const cover =
        document.getElementById("profileCover");

    if (profile.cover) {

        cover.style.backgroundImage =
            `url("${profile.cover}")`;

    } else {

        cover.style.backgroundImage =
            "linear-gradient(135deg,#2563eb,#7c3aed,#f97316)";

    }


    document.getElementById("profileDetails")
        .innerHTML = `

            <div class="detail">
                <strong>পরিচয়</strong>
                ${escapeHTML(profile.role)}
            </div>

            <div class="detail">
                <strong>Bio</strong>
                ${escapeHTML(profile.bio || "কোনো Bio দেওয়া হয়নি।")}
            </div>

        `;
}

    profile.role =
        document.getElementById("editRole").value;

        document.getElementById("editBio").value.trim();

/* =========================================================
   NAVIGATION
   ========================================================= */

function navigate(page, saveHistory = true) {

    if (!document.getElementById(page)) {
        return;
    }

    if (
        saveHistory &&
        currentPage !== page
    ) {

        previousPages.push(currentPage);

    }


    document
        .querySelectorAll(".page")
        .forEach(p => p.classList.remove("active"));


    document
        .getElementById(page)
        .classList.add("active");


    currentPage = page;


    document
        .querySelectorAll(".nav-btn")
        .forEach(btn => {

            btn.classList.toggle(
                "active",
                btn.dataset.page === page
            );

        });


    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });

}


function goBack() {

    if (previousPages.length > 0) {

        const page =
            previousPages.pop();

        navigate(page, false);

    } else {

        navigate("home", false);

    }

}


/* =========================================================
   ANDROID / BROWSER BACK BUTTON
   ========================================================= */

window.addEventListener(
    "popstate",
    function() {

        if (previousPages.length > 0) {

            const page =
                previousPages.pop();

            navigate(page, false);

        } else {

            navigate("home", false);

        }

    }
);


/*
   Push a history state whenever internal navigation happens.
   This makes Android browser back work with the app.
*/

/* =========================================================

   ========================================================= */

function createContentCard(item) {

    const teacher =
        teachers.find(
            t => t.id === item.teacherId
        );

    if (!teacher) return "";


    return `

        <article
            class="content-card"
            onclick="openContent(${item.id})">

            <div class="thumbnail">
                ${item.icon}
            </div>

            <div class="card-info">

                <div class="card-title">
                    ${escapeHTML(item.title)}
                </div>

                <div class="card-meta">
                    ${escapeHTML(item.subject)}
                </div>

                <div
                    class="teacher-row"
                    onclick="event.stopPropagation();openTeacher('${teacher.id}')">

                    <div class="teacher-logo">

                        ${teacher.logo}

                    </div>

                    <div class="teacher-name">

                        ${escapeHTML(teacher.name)}

                    </div>

                </div>

            </div>

        </article>

    `;

}

/* =========================================================
   SAVE CONTENT
   ========================================================= */

function saveContent(id) {

    let saved =
        JSON.parse(
            localStorage.getItem("fliktide_saved")
        ) || [];


    if (!saved.includes(id)) {

        saved.push(id);

        localStorage.setItem(
            "fliktide_saved",
            JSON.stringify(saved)
        );

        alert("Content Library-তে Save হয়েছে।");

        renderLibrary();

    } else {

        alert("এই Content আগে থেকেই Library-তে আছে।");

    }

}


/* =========================================================
   SEARCH
   ========================================================= */

function searchContent(query) {

    query =
        query.toLowerCase().trim();


    if (!query) {

        renderHome();

        return;

    }


    const results =
        contents.filter(item => {

            const teacher =
                teachers.find(
                    t => t.id === item.teacherId
                );

            return (

                item.title
                    .toLowerCase()
                    .includes(query)

                ||

                item.subject
                    .toLowerCase()
                    .includes(query)

                ||

                teacher.name
                    .toLowerCase()
                    .includes(query)

            );

        });


    renderHome(results);

}


function searchExplore(query) {

    query =
        query.toLowerCase().trim();


    if (!query) {

        renderExplore();

        return;

    }


    const results =
        contents.filter(item => {

            const teacher =
                teachers.find(
                    t => t.id === item.teacherId
                );

            return (

                item.title
                    .toLowerCase()
                    .includes(query)

                ||

                item.subject
                    .toLowerCase()
                    .includes(query)

                ||

                teacher.name
                    .toLowerCase()
                    .includes(query)

            );

        });


    renderExplore(results);

}

    );


    document.getElementById("themeBtn")
        .textContent =
        dark ? "☀️" : "🌙";

function loadTheme() {

        localStorage.getItem(
            "fliktide_theme"
        );


    if (theme === "dark") {

        document.body.classList.add("dark");

        document.getElementById("themeBtn")
            .textContent = "☀️";

    }

}


/* =========================================================
   TODAY WATCH TIME
   ========================================================= */

function getTodayKey() {

    const date =
        new Date();

    return (
        "fliktide_watch_" +
        date.getFullYear() +
        "_" +
        (date.getMonth() + 1) +
        "_" +
        date.getDate()
    );

}


function updateWatchTime() {

    const key =
        getTodayKey();


    let seconds =
        Number(
            localStorage.getItem(key)
        ) || 0;


    seconds++;


    localStorage.setItem(
        key,
        seconds
    );


    const hours =
        Math.floor(seconds / 3600);

    const minutes =
        Math.floor(
            (seconds % 3600) / 60
        );

    const secs =
        seconds % 60;


    const formatted =
        String(hours).padStart(2,"0") +
        ":" +
        String(minutes).padStart(2,"0") +
        ":" +
        String(secs).padStart(2,"0");


    document.getElementById("watchTime")
        .textContent = formatted;

}

/* =========================================================
   SECURITY HELPER
   ========================================================= */

function escapeHTML(value) {

    return String(value)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");

}
