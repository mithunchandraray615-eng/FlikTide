<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>FlickTide</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

:root{
    --bg:#0f172a;
    --card:#111827;
    --card2:#1e293b;
    --text:#f8fafc;
    --muted:#94a3b8;
    --border:#263247;
    --primary:#2563eb;
    --orange:#ff7200;
    --white:#ffffff;
}

body.light{
    --bg:#f4f6fb;
    --card:#ffffff;
    --card2:#eef2f7;
    --text:#111827;
    --muted:#64748b;
    --border:#dbe2ea;
}

body{
    font-family:
        Arial,
        "Noto Sans Bengali",
        sans-serif;

    background:var(--bg);
    color:var(--text);
    min-height:100vh;
    overflow-x:hidden;
}

/* =========================
   HEADER
========================= */

.header{
    position:sticky;
    top:0;
    z-index:1000;

    height:74px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:10px 22px;

    background:var(--bg);
    border-bottom:1px solid var(--border);
}

.brand{
    display:flex;
    align-items:center;
    gap:14px;

    cursor:pointer;
}

.logo{
    width:50px;
    height:50px;

    border-radius:16px;

    display:flex;
    align-items:center;
    justify-content:center;

    background:
        linear-gradient(135deg,#2563eb,#7c3aed,#ff7200);

    color:white;
    font-size:20px;
    font-weight:900;
}

.brand-name{
    font-size:27px;
    font-weight:900;
}

.brand-name span{
    color:var(--orange);
}

.header-actions{
    display:flex;
    align-items:center;
    gap:12px;
}

.icon-btn{
    width:52px;
    height:52px;

    border:0;
    border-radius:17px;

    background:var(--card2);
    color:var(--text);

    font-size:24px;
    cursor:pointer;
}

.profile-mini{
    width:52px;
    height:52px;

    border-radius:50%;

    display:flex;
    align-items:center;
    justify-content:center;

    background:linear-gradient(135deg,#2563eb,#7c3aed);

    color:white;
    font-size:20px;
    font-weight:800;

    cursor:pointer;
    overflow:hidden;
}

.profile-mini img{
    width:100%;
    height:100%;
    object-fit:cover;
}

/* =========================
   SEARCH
========================= */

.search-area{
    padding:18px 22px 8px;
}

.search-box{
    height:55px;

    display:flex;
    align-items:center;
    gap:12px;

    padding:0 18px;

    border:1px solid var(--border);
    border-radius:28px;

    background:var(--card);
}

.search-box input{
    flex:1;

    border:0;
    outline:0;

    background:transparent;
    color:var(--text);

    font-size:17px;
}

/* =========================
   PAGE
========================= */

.page{
    display:none;
    min-height:calc(100vh - 145px);
    padding-bottom:95px;
}

.page.active{
    display:block;
}

.page-content{
    padding:12px 22px;
}

.page-title{
    font-size:28px;
    font-weight:900;
    margin:15px 0 20px;
}

/* =========================
   HOME FEED
========================= */

.video-feed{
    display:flex;
    flex-direction:column;
    gap:20px;
}

.long-card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:22px;
    overflow:hidden;
    cursor:pointer;
}

.thumbnail{
    position:relative;

    width:100%;
    aspect-ratio:16/9;

    display:flex;
    align-items:center;
    justify-content:center;

    background:
        linear-gradient(135deg,#dbeafe,#fef3c7);

    color:#334155;

    font-size:65px;
}

.thumbnail .duration{
    position:absolute;
    right:10px;
    bottom:10px;

    padding:5px 8px;

    border-radius:6px;

    background:rgba(0,0,0,.8);
    color:white;

    font-size:13px;
}

.video-info{
    padding:15px;
}

.video-title{
    font-size:19px;
    font-weight:800;
    line-height:1.4;
}

.video-meta{
    margin-top:7px;

    color:var(--muted);
    font-size:14px;
}

.teacher-row{
    display:flex;
    align-items:center;
    gap:10px;

    margin-top:12px;
}

.teacher-logo{
    width:36px;
    height:36px;

    border-radius:50%;

    background:linear-gradient(135deg,#2563eb,#9333ea);

    color:white;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:13px;
    font-weight:bold;

    overflow:hidden;
}

.teacher-logo img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.teacher-name{
    color:var(--muted);
    font-size:14px;
}

/* =========================
   SHORTS SECTION
========================= */

.shorts-section{
    margin:8px 0 15px;
}

.shorts-heading{
    font-size:22px;
    font-weight:900;
    margin-bottom:12px;
}

.shorts-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}

.short-card{
    background:var(--card);
    border:1px solid var(--border);

    border-radius:18px;

    overflow:hidden;
    cursor:pointer;
}

.short-thumbnail{
    width:100%;
    aspect-ratio:9/16;

    display:flex;
    align-items:center;
    justify-content:center;

    background:
        linear-gradient(145deg,#dbeafe,#fff7ed);

    font-size:48px;
}

.short-info{
    padding:12px;
}

.short-title{
    font-size:15px;
    font-weight:800;
    line-height:1.4;
}

.short-meta{
    color:var(--muted);
    margin-top:5px;
    font-size:12px;
}

/* =========================
   BOTTOM NAV
========================= */

.bottom-nav{
    position:fixed;
    bottom:0;
    left:0;
    right:0;

    height:76px;

    z-index:1000;

    display:grid;
    grid-template-columns:repeat(5,1fr);

    background:var(--bg);
    border-top:1px solid var(--border);
}

.nav-item{
    border:0;
    background:transparent;

    color:var(--muted);

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

    gap:4px;

    cursor:pointer;
}

.nav-item.active{
    color:#2563eb;
}

.nav-icon{
    font-size:23px;
}

.nav-label{
    font-size:12px;
}

/* =========================
   BACK BUTTON
========================= */

.back-bar{
    display:none;

    padding:14px 22px 5px;
}

.back-bar.show{
    display:block;
}

.back-button{
    border:0;
    background:var(--card2);
    color:var(--text);

    border-radius:12px;

    padding:10px 15px;

    font-size:16px;
    cursor:pointer;
}

/* =========================
   VIDEO PLAYER
========================= */

.player-page{
    padding:0 0 100px;
}

.video-player-wrapper{
    position:relative;

    width:100%;

    background:#000;

    display:flex;
    align-items:center;
    justify-content:center;
}

#mainVideo{
    width:100%;
    max-height:75vh;

    display:block;

    background:#000;

    object-fit:contain;

    transition:transform .2s ease;
}

.player-controls{
    position:absolute;
    right:12px;
    bottom:12px;

    display:flex;
    gap:8px;
}

.player-btn{
    border:0;

    background:rgba(0,0,0,.75);
    color:#fff;

    width:42px;
    height:42px;

    border-radius:50%;

    cursor:pointer;
    font-size:18px;
}

.player-info{
    padding:18px 22px;
}

.player-title{
    font-size:23px;
    font-weight:900;
    line-height:1.4;
}

.player-description{
    margin-top:10px;
    color:var(--muted);
    line-height:1.6;
}

.player-teacher{
    margin-top:15px;

    display:flex;
    align-items:center;
    gap:12px;

    cursor:pointer;
}

.suggested{
    padding:10px 22px;
}

.suggested-title{
    font-size:22px;
    font-weight:900;
    margin-bottom:15px;
}

/* =========================
   PROFILE
========================= */

.profile-page{
    padding-bottom:100px;
}

.cover{
    position:relative;

    height:190px;

    background:
        linear-gradient(135deg,#2563eb,#7c3aed,#ec4899);

    overflow:hidden;
}

.cover img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.profile-card{
    margin:0 22px;

    margin-top:-40px;

    position:relative;
    z-index:2;

    padding:85px 22px 28px;

    border-radius:28px;

    background:var(--card);

    border:1px solid var(--border);
}

.profile-photo{
    position:absolute;

    top:-70px;
    left:22px;

    width:140px;
    height:140px;

    border-radius:50%;

    border:6px solid var(--bg);

    background:
        linear-gradient(135deg,#2563eb,#7c3aed);

    display:flex;
    align-items:center;
    justify-content:center;

    color:#fff;
    font-size:48px;
    font-weight:900;

    overflow:hidden;
}

.profile-photo img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.profile-name{
    font-size:32px;
    font-weight:900;
}

.profile-phone{
    margin-top:6px;
    color:var(--muted);
    font-size:18px;
}

.role-badge{
    display:inline-block;

    margin-top:14px;

    padding:10px 22px;

    background:var(--white);
    color:#475569;

    border-radius:30px;

    font-size:16px;
}

.profile-buttons{
    display:flex;
    gap:10px;

    margin-top:18px;
}

.primary-btn{
    border:0;

    background:var(--primary);
    color:#fff;

    padding:13px 20px;

    border-radius:14px;

    font-size:16px;
    font-weight:800;

    cursor:pointer;
}

/* =========================
   PROFILE STATS
========================= */

.stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);

    gap:10px;

    margin:18px 22px;
}

.stat{
    background:var(--card);

    border:1px solid var(--border);

    border-radius:17px;

    padding:15px 8px;

    text-align:center;
}

.stat-number{
    font-size:20px;
    font-weight:900;
}

.stat-label{
    color:var(--muted);
    font-size:12px;
    margin-top:4px;
}

/* =========================
   EDIT MODAL
========================= */

.modal{
    position:fixed;
    inset:0;

    z-index:3000;

    display:none;
    align-items:flex-end;
    justify-content:center;

    background:rgba(0,0,0,.7);
}

.modal.show{
    display:flex;
}

.modal-box{
    width:100%;
    max-width:600px;

    background:var(--card);

    border-radius:28px 28px 0 0;

    padding:25px;

    max-height:90vh;
    overflow-y:auto;
}

.modal-title{
    font-size:23px;
    font-weight:900;

    margin-bottom:20px;
}

.form-group{
    margin-bottom:15px;
}

.form-group label{
    display:block;

    margin-bottom:7px;

    color:var(--muted);
}

.form-group input,
.form-group select{
    width:100%;

    padding:14px;

    border-radius:13px;

    border:1px solid var(--border);

    background:var(--bg);
    color:var(--text);

    outline:none;
}

.modal-actions{
    display:flex;
    gap:10px;

    margin-top:20px;
}

.secondary-btn{
    flex:1;

    border:1px solid var(--border);

    background:var(--card2);
    color:var(--text);

    padding:13px;

    border-radius:13px;

    cursor:pointer;
}

.primary-btn.full{
    flex:1;
}

/* =========================
   TEACHER PROFILE
========================= */

.teacher-profile-header{
    text-align:center;

    padding:25px;
}

.big-teacher-logo{
    width:110px;
    height:110px;

    margin:auto;

    border-radius:50%;

    background:linear-gradient(135deg,#2563eb,#7c3aed);

    display:flex;
    align-items:center;
    justify-content:center;

    color:#fff;
    font-size:38px;
    font-weight:900;

    overflow:hidden;
}

.big-teacher-logo img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.teacher-profile-name{
    font-size:28px;
    font-weight:900;
    margin-top:15px;
}

.teacher-subject{
    color:var(--muted);
    margin-top:5px;
}

/* =========================
   EXPLORE
========================= */

.explore-search{
    margin-bottom:18px;
}

.category-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:12px;
}

.category{
    padding:22px;

    background:var(--card);

    border:1px solid var(--border);

    border-radius:18px;

    cursor:pointer;

    font-weight:800;
}

/* =========================
   LIBRARY
========================= */

.empty-state{
    padding:60px 20px;

    text-align:center;

    color:var(--muted);
}

/* =========================
   RESPONSIVE
========================= */

@media(min-width:800px){

    .page-content,
    .search-area{
        max-width:1100px;
        margin:auto;
    }

    .video-feed{
        display:grid;
        grid-template-columns:repeat(2,1fr);
    }

    .shorts-section{
        grid-column:1/-1;
    }

    .shorts-grid{
        grid-template-columns:repeat(2,250px);
    }

    .bottom-nav{
        max-width:700px;
        left:50%;
        transform:translateX(-50%);
        border:1px solid var(--border);
        border-radius:20px 20px 0 0;
    }
}

@media(max-width:480px){

    .header{
        height:72px;
        padding:10px 18px;
    }

    .brand-name{
        font-size:23px;
    }

    .logo{
        width:45px;
        height:45px;
    }

    .header-actions{
        gap:7px;
    }

    .icon-btn{
        width:45px;
        height:45px;
    }

    .profile-mini{
        width:45px;
        height:45px;
    }

    .page-content{
        padding:10px 22px;
    }
}
</style>
</head>

<body>

<!-- =====================================================
     HEADER
===================================================== -->

<header class="header">

    <div class="brand" onclick="navigateHome()">

        <div class="logo">
            FT
        </div>

        <div class="brand-name">
            Flick<span>Tide</span>
        </div>

    </div>

    <div class="header-actions">

        <button class="icon-btn"
                onclick="toggleTheme()"
                aria-label="Theme">
            🌙
        </button>

        <button class="icon-btn"
                onclick="showNotifications()"
                aria-label="Notifications">
            🔔
        </button>

        <div class="profile-mini"
             id="miniProfile"
             onclick="navigate('profile')">
            M
        </div>

    </div>

</header>


<!-- =====================================================
     BACK BUTTON
===================================================== -->

<div class="back-bar" id="backBar">

    <button class="back-button"
            onclick="goBack()">
        ← আগের পেজ
    </button>

</div>


<!-- =====================================================
     HOME
===================================================== -->

<main id="homePage"
      class="page active">

    <div class="search-area">

        <div class="search-box">

            🔍

            <input
                id="homeSearch"
                type="search"
                placeholder="ভিডিও, বিষয়, শিক্ষক খুঁজুন..."
                oninput="searchHome(this.value)"
            >

        </div>

    </div>

    <div class="page-content">

        <div class="video-feed"
             id="homeFeed">

        </div>

    </div>

</main>


<!-- =====================================================
     SHORTS
===================================================== -->

<main id="shortsPage"
      class="page">

    <div class="page-content">

        <h1 class="page-title">
            Shorts
        </h1>

        <div class="shorts-grid"
             id="shortsFeed">

        </div>

    </div>

</main>


<!-- =====================================================
     EXPLORE
===================================================== -->

<main id="explorePage"
      class="page">

    <div class="page-content">

        <h1 class="page-title">
            Explore
        </h1>

        <div class="search-box explore-search">

            🔍

            <input
                id="exploreSearch"
                placeholder="বিষয় বা শিক্ষক খুঁজুন..."
                oninput="searchExplore(this.value)"
            >

        </div>

        <div class="category-grid"
             id="categoryGrid">

        </div>

    </div>

</main>


<!-- =====================================================
     LIBRARY
===================================================== -->

<main id="libraryPage"
      class="page">

    <div class="page-content">

        <h1 class="page-title">
            Library
        </h1>

        <div class="empty-state">

            📚

            <br><br>

            আপনার Save করা ভিডিও এখানে থাকবে।

        </div>

    </div>

</main>


<!-- =====================================================
     PROFILE
===================================================== -->

<main id="profilePage"
      class="page profile-page">

    <div class="cover"
         id="profileCover">

        <img id="coverImage"
             style="display:none">

    </div>

    <div class="profile-card">

        <div class="profile-photo"
             id="profilePhoto">

            M

        </div>

        <div class="profile-name"
             id="profileName">
            Mithun Chandra Ray
        </div>

        <div class="profile-phone"
             id="profilePhone">
            01708744994
        </div>

        <span class="role-badge"
              id="profileRole">
            Student
        </span>

        <div class="profile-buttons">

            <button class="primary-btn"
                    onclick="openEditProfile()">
                Edit Profile
            </button>

        </div>

    </div>

    <div class="stats">

        <div class="stat">

            <div class="stat-number"
                 id="watchHours">
                0h 0m 0s
            </div>

            <div class="stat-label">
                আজকের সময়
            </div>

        </div>

        <div class="stat">

            <div class="stat-number">
                0
            </div>

            <div class="stat-label">
                Saved
            </div>

        </div>

        <div class="stat">

            <div class="stat-number">
                0
            </div>

            <div class="stat-label">
                Liked
            </div>

        </div>

    </div>

</main>


<!-- =====================================================
     TEACHER PROFILE
===================================================== -->

<main id="teacherPage"
      class="page">

    <div class="page-content">

        <div class="teacher-profile-header">

            <div class="big-teacher-logo"
                 id="teacherBigLogo">
                T
            </div>

            <div class="teacher-profile-name"
                 id="teacherProfileName">
                FlickTide Teacher
            </div>

            <div class="teacher-subject"
                 id="teacherProfileSubject">
                শিক্ষক
            </div>

        </div>

        <h2 class="page-title">
            এই শিক্ষকের কন্টেন্ট
        </h2>

        <div class="video-feed"
             id="teacherFeed">

        </div>

    </div>

</main>


<!-- =====================================================
     VIDEO PLAYER
===================================================== -->

<main id="playerPage"
      class="page player-page">

    <div class="video-player-wrapper">

        <video
            id="mainVideo"
            controls
            playsinline>
        </video>

        <div class="player-controls">

            <button class="player-btn"
                    onclick="zoomVideo(-0.1)">
                −
            </button>

            <button class="player-btn"
                    onclick="resetVideoZoom()">
                1×
            </button>

            <button class="player-btn"
                    onclick="zoomVideo(0.1)">
                +
            </button>

            <button class="player-btn"
                    onclick="fullscreenVideo()">
                ⛶
            </button>

        </div>

    </div>

    <div class="player-info">

        <div class="player-title"
             id="playerTitle">
        </div>

        <div class="player-description"
             id="playerDescription">
        </div>

        <div class="player-teacher"
             onclick="openCurrentTeacher()">

            <div class="teacher-logo"
                 id="playerTeacherLogo">
            </div>

            <div>
                <strong id="playerTeacherName">
                </strong>

                <div class="teacher-name"
                     id="playerTeacherSubject">
                </div>
            </div>

        </div>

    </div>

    <section class="suggested">

        <div class="suggested-title">
            সম্পর্কিত ভিডিও
        </div>

        <div class="video-feed"
             id="suggestedFeed">
        </div>

    </section>

</main>


<!-- =====================================================
     EDIT PROFILE MODAL
===================================================== -->

<div class="modal"
     id="editModal">

    <div class="modal-box">

        <div class="modal-title">
            Edit Profile
        </div>

        <div class="form-group">

            <label>
                নাম
            </label>

            <input
                id="editName"
                type="text"
                placeholder="আপনার নাম">

        </div>

        <div class="form-group">

            <label>
                মোবাইল নাম্বার
            </label>

            <input
                id="editPhone"
                type="tel"
                placeholder="01XXXXXXXXX">

        </div>

        <div class="form-group">

            <label>
                Account Type
            </label>

            <select id="editRole">

                <option>
                    Student
                </option>

                <option>
                    Teacher
                </option>

            </select>

        </div>

        <div class="form-group">

            <label>
                Profile Photo
            </label>

            <input
                id="profileImageInput"
                type="file"
                accept="image/*">

        </div>

        <div class="form-group">

            <label>
                Cover Photo
            </label>

            <input
                id="coverImageInput"
                type="file"
                accept="image/*">

        </div>

        <div class="modal-actions">

            <button
                class="secondary-btn"
                onclick="closeEditProfile()">
                Cancel

/* =====================================================

===================================================== */

function navigate(page, saveHistory=true){

    const pages = [
        "home",
        "shorts",
        "explore",
        "library",
        "profile",
        "teacher",
        "player"
    ];

    pages.forEach(p=>{

        const element =
            document.getElementById(p+"Page");

        if(element){
            element.classList.remove("active");
        }

    });

    const target =
        document.getElementById(page+"Page");

    if(target){
        target.classList.add("active");
    }

    if(saveHistory){

        pageHistory.push(page);

        history.pushState(
            {page:page},
            "",
            "#"+page
        );

    }

    updateBottomNavigation(page);

    updateBackButton(page);

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });
}


function navigateHome(){

    navigate("home");
}


function goBack(){

    if(pageHistory.length > 1){

        pageHistory.pop();

        history.back();

    }else{

        navigate("home");

    }

}


function handleBrowserBack(){

    if(pageHistory.length > 1){

        pageHistory.pop();

    }else{

        pageHistory = ["home"];

    }

    const page =
        pageHistory[pageHistory.length-1] || "home";

    navigate(page,false);

}


function updateBackButton(page){

    const backBar =
        document.getElementById("backBar");

    const normalPages = [
        "home",
        "shorts",
        "explore",
        "library",
        "profile"
    ];

    if(normalPages.includes(page)){

        backBar.classList.remove("show");

    }else{

        backBar.classList.add("show");

    }

}


function updateBottomNavigation(page){

    document
        .querySelectorAll(".nav-item")
        .forEach(item=>{

            item.classList.remove("active");

        });

    const item =
        document.querySelector(
            `.nav-item[data-page="${page}"]`
        );

    if(item){
        item.classList.add("active");
    }

}

function renderHome(list=longVideos){

           ২টি Shorts পাশাপাশি
        */

        if(

            index < list.length-1
        ){

                document.createElement("section");

            section.className="shorts-section";

            section.innerHTML=`
                <div class="shorts-heading">
                    Shorts
                </div>

                <div class="shorts-grid">

                    ${shorts.slice(0,2)
                        .map(s=>createShortHTML(s))
                        .join("")}

                </div>
            `;

            feed.appendChild(section);

        }

    });

}


/* =====================================================
   LONG CARD
===================================================== */

function createLongCard(video){

    const card =
        document.createElement("article");

    card.className="long-card";

    card.innerHTML=`

        <div class="thumbnail">

            <span>
                ${video.icon}
            </span>

            <div class="duration">
                ${video.duration}
            </div>

        </div>

        <div class="video-info">

            <div class="video-title">
                ${video.title}
            </div>

            <div class="video-meta">
                ${video.subject}
            </div>

            <div class="teacher-row"
                 onclick="event.stopPropagation(); openTeacher('${video.teacherId}')">

                <div class="teacher-logo">
                    ${video.teacherLogo}
                </div>

                <div class="teacher-name">
                    ${video.teacher}
                </div>

            </div>

        </div>

    `;

    card.onclick=()=>openVideo(video);

    return card;

}

===================================================== */

function renderShorts(list=shorts){

    list.forEach(short=>{

        feed.insertAdjacentHTML(
            "beforeend",
            createShortHTML(short)
        );

    });

}


function createShortHTML(short){

    return `

        <article
            class="short-card"
            onclick="openShort(${short.id})">

            <div class="short-thumbnail">
                ${short.logo}
            </div>

            <div class="short-info">

                <div class="short-title">
                    ${short.title}
                </div>

                <div class="short-meta">
                    ${short.subject} • ${short.teacher}
                </div>

            </div>

        </article>

    `;

}


function openShort(id){

    const short =
        shorts.find(s=>s.id===id);

    if(!short) return;

    /*
       Shorts-কে vertical player হিসেবে চালানোর
       foundation।
    */

    const video = {

        id:short.id,

        title:short.title,

        subject:short.subject,

        teacher:short.teacher,

        teacherId:short.teacherId,

        teacherLogo:short.logo,

        description:
            "এই Short ভিডিওটি FlickTide-এর শিক্ষামূলক কন্টেন্ট।",

        video:
            "https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4"

    };

    openVideo(video);

}


/* =====================================================
   VIDEO PLAYER
===================================================== */

function openVideo(video){

    currentVideo = video;

    const player =
        document.getElementById("mainVideo");

    player.src = video.video;

    player.currentTime = 0;

    playerZoomReset();

    document.getElementById(
        "playerTitle"
    ).textContent = video.title;

    document.getElementById(
        "playerDescription"
    ).textContent = video.description;

    document.getElementById(
        "playerTeacherName"
    ).textContent = video.teacher;

    document.getElementById(
        "playerTeacherSubject"
    ).textContent = video.subject;

    document.getElementById(
        "playerTeacherLogo"
    ).textContent = video.teacherLogo;

    renderSuggested(video);

    navigate("player");

}


function renderSuggested(video){

    const feed =
        document.getElementById("suggestedFeed");

    feed.innerHTML="";

    const suggestions =
        longVideos
            .filter(v=>v.id!==video.id)
            .filter(v=>
                v.subject===video.subject ||
                v.teacherId===video.teacherId
            )
            .slice(0,6);

    suggestions.forEach(v=>{

        feed.appendChild(
            createLongCard(v)
        );

    });

}


function fullscreenVideo(){

    const player =
        document.getElementById("mainVideo");

    if(player.requestFullscreen){

        player.requestFullscreen();

    }else if(player.webkitEnterFullscreen){

        player.webkitEnterFullscreen();

    }

}


function zoomVideo(amount){

    videoZoom += amount;

    if(videoZoom < 1){
        videoZoom=1;
    }

    if(videoZoom > 2.5){
        videoZoom=2.5;
    }

    document.getElementById(
        "mainVideo"
    ).style.transform =
        `scale(${videoZoom})`;

}


function resetVideoZoom(){

    videoZoom=1;

    document.getElementById(
        "mainVideo"
    ).style.transform =
        "scale(1)";

}


function playerZoomReset(){

    videoZoom=1;

    const player =
        document.getElementById("mainVideo");

    player.style.transform="scale(1)";

}

        );

    renderHome(results);

    categories.forEach(category=>{

        category.style.display =
            category.textContent
                .toLowerCase()
                .includes(query)
                ? "block"

}


function saveProfile(){

    const name =
        document.getElementById(
            "editName"
        ).value.trim();

    const phone =
        document.getElementById(
            "editPhone"
        ).value.trim();

    const role =
        document.getElementById(
            "editRole"
        ).value;

    if(!name){

        alert("নাম লিখুন।");
        return;

    }

    profile.name=name;

    profile.phone=phone;

    profile.role=role;


    const photoInput =
        document.getElementById(
            "profileImageInput"
        );

    const coverInput =
        document.getElementById(
            "coverImageInput"
        );


    const saveAfterImages=()=>{

        localStorage.setItem(
            "flicktide_profile",
            JSON.stringify(profile)
        );

        loadProfile();

        closeEditProfile();

    };


    if(photoInput.files.length){

        const reader =
            new FileReader();

        reader.onload=e=>{

            profile.photo=e.target.result;

            saveAfterImages();

        };

        reader.readAsDataURL(
            photoInput.files[0]
        );

    }else if(coverInput.files.length){

        const reader =
            new FileReader();

        reader.onload=e=>{

            profile.cover=e.target.result;

            saveAfterImages();

        };

        reader.readAsDataURL(
            coverInput.files[0]
        );

    }else{

        saveAfterImages();

    }


    /*
       Cover image থাকলেও profile photo থাকলে
       দুইটি file একসাথে save করার জন্য
       পরের foundation update-এ async version
       ব্যবহার করা যাবে।
    */

}


/* =====================================================
   THEME
===================================================== */

function toggleTheme(){

    document.body.classList.toggle("light");

    localStorage.setItem(
        "flicktide_theme",
        document.body.classList.contains("light")
            ? "light"
            : "dark"
    );

}


if(
    localStorage.getItem("flicktide_theme")
    ==="light"
){

    document.body.classList.add("light");

}


/* =====================================================
   NOTIFICATION
===================================================== */

function showNotifications(){

    alert(
        "এখনো কোনো নতুন notification নেই।"
    );

}


/* =====================================================
   WATCH TIME
===================================================== */

let watchSeconds =
    Number(
        localStorage.getItem(
            "flicktide_watch_seconds"
        )
    ) || 0;


function startWatchTimer(){

    setInterval(()=>{

        /*
           এখানে site open থাকা সময় গণনা হচ্ছে।
           পরে video-playing time-এর সঙ্গে
           এটিকে connect করা যাবে।
        */

        watchSeconds++;

        localStorage.setItem(
            "flicktide_watch_seconds",
            watchSeconds
        );

        updateWatchTime();

    },1000);

}


function updateWatchTime(){

    const hours =
        Math.floor(
            watchSeconds/3600
        );

    const minutes =
        Math.floor(
            (watchSeconds%3600)/60
        );

    const seconds =
        watchSeconds%60;

    const element =
        document.getElementById(
            "watchHours"
        );

    if(element){

        element.textContent =
            `${hours}h ${minutes}m ${seconds}s`;

    }

}


/* =====================================================
   MOBILE BACK / INITIAL HISTORY
===================================================== */

if(!location.hash){

    history.replaceState(
        {page:"home"},
        "",
        "#home"
    );

}

pageHistory=["home"];


/* =====================================================
   CLOSE MODAL BY OUTSIDE CLICK
===================================================== */

document
    .getElementById("editModal")
    .addEventListener(
        "click",
        function(e){

            if(e.target===this){

                closeEditProfile();

            }

        }
    );


/* =====================================================
   KEYBOARD / ESC
===================================================== */

document.addEventListener(
    "keydown",
    e=>{

        if(e.key==="Escape"){

            closeEditProfile();

        }

    }
);
