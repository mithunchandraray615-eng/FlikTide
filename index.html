<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FlikTide</title>

    <!-- Main stylesheet -->
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <!-- =========================
         APP ROOT
    ========================== -->
    <div id="app">

        <!-- =========================
             TOP HEADER
        ========================== -->
        <header id="app-header">

            <!-- Menu -->
            <button
                id="menu-button"
                type="button"
                aria-label="Menu">
                ☰
            </button>

            <!-- Logo / Brand -->
            <a
                id="brand"
                href="#home"
                aria-label="FlikTide Home">
                
                <div id="brand-logo">FT</div>

                <div id="brand-name">
                    <span>Flik</span><strong>Tide</strong>
                </div>

            </a>

            <!-- Header actions -->
            <div id="header-actions">

                <button
                    id="theme-button"
                    type="button"
                    aria-label="Theme">
                    🌙
                </button>

                <button
                    id="notification-button"
                    type="button"
                    aria-label="Notifications">
                    🔔
                </button>

                <button
                    id="profile-button"
                    type="button"
                    aria-label="Profile">
                    <span id="header-profile-avatar">M</span>
                </button>

            </div>

        </header>


        <!-- =========================
             PAGE CONTAINER
        ========================== -->
        <main id="main-content">

            <!--
                Different pages will be rendered here later.

                Example pages:
                - Home
                - Shorts
                - Explore
                - Library
                - Profile
                - Teacher Profile
                - Video Player
                - Settings
            -->

            <section
                id="page-home"
                class="page"
                data-page="home">

                <!-- Home page content will be added later -->

            </section>


            <section
                id="page-shorts"
                class="page"
                data-page="shorts"
                hidden>

                <!-- Shorts content will be added later -->

            </section>


            <section
                id="page-explore"
                class="page"
                data-page="explore"
                hidden>

                <!-- Explore content will be added later -->

            </section
                <a
    href="library/library.html"
    class="bottom-nav-item">

    <span class="bottom-nav-icon">
        ▣
    </span>

    <span class="bottom-nav-label">
        Library
    </span>

                </a>

            </section>


            <section
                id="page-profile"
                class="page"
                data-page="profile"
                hidden>

                <!-- Profile content will be added later -->

            </section>

        </main>


        <!-- =========================
             BOTTOM NAVIGATION
        ========================== -->
        <nav
            id="bottom-navigation"
            aria-label="Main navigation">

            <button
                class="nav-item active"
                data-page-target="home"
                type="button">

                <span class="nav-icon">⌂</span>
                <span class="nav-label">Home</span>

            </button>


            <button
                class="nav-item"
                data-page-target="shorts"
                type="button">

                <span class="nav-icon">▶</span>
                <span class="nav-label">Shorts</span>

            </button>


            <button
                class="nav-item"
                data-page-target="explore"
                type="button">

                <span class="nav-icon">◉</span>
                <span class="nav-label">Explore</span>

            </button>


            <button
                class="nav-item"
                data-page-target="library"
                type="button">

                <span class="nav-icon">▣</span>
                <span class="nav-label">Library</span>

            </button>


            <button
                class="nav-item"
                data-page-target="profile"
                type="button">

                <span class="nav-icon">♙</span>
                <span class="nav-label">Profile</span>

            </button>

        </nav>

    </div>


    <!--
        JavaScript functionality will be added
        in separate files later.
    -->

    <script src="js/app.js"></script>

</body>
</html>
