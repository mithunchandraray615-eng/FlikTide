<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>FlickTide</title>

  <!-- Main stylesheet — পরে আলাদা CSS ফাইলে থাকবে -->
  <link rel="stylesheet" href="css/main.css">
</head>

<body>

  <!-- =========================================
       APP ROOT
       ========================================= -->
  <div id="app">

    <!-- =========================================
         TOP HEADER
         ========================================= -->
    <header class="app-header">

      <!-- Menu -->
      <button
        class="header-button"
        id="menuButton"
        type="button"
        aria-label="Menu"
      >
        ☰
      </button>

      <!-- Brand -->
      <a href="#" class="brand" id="brandLink">
        <div class="brand-logo">FT</div>

        <div class="brand-name">
          <span>Flick</span><strong>Tide</strong>
        </div>
      </a>

      <!-- Header Actions -->
      <div class="header-actions">

        <!-- Theme -->
        <button
          class="header-button"
          id="themeButton"
          type="button"
          aria-label="Theme"
        >
          🌙
        </button>

        <!-- Notification -->
        <button
          class="header-button notification-button"
          id="notificationButton"
          type="button"
          aria-label="Notifications"
        >
          🔔
          <span class="notification-dot"></span>
        </button>

        <!-- Profile -->
        <button
          class="profile-button"
          id="headerProfileButton"
          type="button"
          aria-label="Profile"
        >
          M
        </button>

      </div>

    </header>


    <!-- =========================================
         MAIN CONTENT AREA
         ========================================= -->
    <main id="mainContent">

      <!--
        ভবিষ্যতে Home / Explore / Library / Profile
        আলাদা Page এখানে render হবে।
      -->

      <section
        id="homePage"
        class="page active-page"
        aria-label="Home"
      >

        <!-- =====================================
             HOME PAGE HEADER / SEARCH
             ===================================== -->
        <div class="home-top">

          <div class="search-box">

            <span class="search-icon">⌕</span>

            <input
              type="search"
              id="searchInput"
              placeholder="ভিডিও, বিষয়, শিক্ষক খুঁজুন..."
              autocomplete="off"
            >

          </div>

        </div>


        <!-- =====================================
             HOME FEED CONTAINER
             ===================================== -->
        <section
          id="homeFeed"
          class="feed-container"
          aria-label="Video Feed"
        >

          <!--
            ভিডিওগুলো এখানে পরে Feed system থেকে আসবে।

            এই index.html-এ কোনো ভিডিও,
            recommendation বা feed logic রাখা হচ্ছে না।
          -->

        </section>

      </section>


      <!-- =========================================
           EXPLORE PAGE
           ========================================= -->
      <section
        id="explorePage"
        class="page"
        aria-label="Explore"
        hidden
      >

        <div class="page-header">

          <button
            class="back-button"
            type="button"
            data-back
            aria-label="Back"
          >
            ←
          </button>

          <h1>Explore</h1>

        </div>

        <div id="exploreContent"></div>

      </section>


      <!-- =========================================
           LIBRARY PAGE
           ========================================= -->
      <section
        id="libraryPage"
        class="page"
        aria-label="Library"
        hidden
      >

        <div class="page-header">

          <button
            class="back-button"
            type="button"
            data-back
            aria-label="Back"
          >
            ←
          </button>

          <h1>Library</h1>

        </div>

        <div id="libraryContent"></div>

      </section>


      <!-- =========================================
           PROFILE PAGE
           ========================================= -->
      <section
        id="profilePage"
        class="page"
        aria-label="Profile"
        hidden
      >

        <div class="page-header">

          <button
            class="back-button"
            type="button"
            data-back
            aria-label="Back"
          >
            ←
          </button>

          <h1>Profile</h1>

        </div>

        <div id="profileContent"></div>

      </section>


      <!-- =========================================
           VIDEO PAGE
           ========================================= -->
      <section
        id="videoPage"
        class="page"
        aria-label="Video"
        hidden
      >

        <div class="page-header">

          <button
            class="back-button"
            type="button"
            data-back
            aria-label="Back"
          >
            ←
          </button>

          <h1>Video</h1>

        </div>

        <div id="videoContent"></div>

      </section>


      <!-- =========================================
           TEACHER PROFILE PAGE
           ========================================= -->
      <section
        id="teacherPage"
        class="page"
        aria-label="Teacher Profile"
        hidden
      >

        <div class="page-header">

          <button
            class="back-button"
            type="button"
            data-back
            aria-label="Back"
          >
            ←
          </button>

          <h1>Teacher</h1>

        </div>

        <div id="teacherContent"></div>

      </section>

    </main>


    <!-- =========================================
         BOTTOM NAVIGATION
         ========================================= -->
    <nav
      class="bottom-navigation"
      id="bottomNavigation"
      aria-label="Main Navigation"
    >

      <!-- Home -->
      <button
        class="nav-item active"
        type="button"
        data-page="homePage"
        aria-label="Home"
      >
        <span class="nav-icon">⌂</span>
        <span class="nav-label">Home</span>
      </button>


      <!-- Shorts -->
      <button
        class="nav-item"
        type="button"
        data-page="shortsPage"
        aria-label="Shorts"
      >
        <span class="nav-icon">▶</span>
        <span class="nav-label">Shorts</span>
      </button>


      <!-- Explore -->
      <button
        class="nav-item"
        type="button"
        data-page="explorePage"
        aria-label="Explore"
      >
        <span class="nav-icon">◎</span>
        <span class="nav-label">Explore</span>
      </button>


      <!-- Library -->
      <button
        class="nav-item"
        type="button"
        data-page="libraryPage"
        aria-label="Library"
      >
        <span class="nav-icon">▣</span>
        <span class="nav-label">Library</span>
      </button>


      <!-- Profile -->
      <button
        class="nav-item"
        type="button"
        data-page="profilePage"
        aria-label="Profile"
      >
        <span class="nav-icon">♙</span>
        <span class="nav-label">Profile</span>
      </button>

    </nav>


    <!-- =========================================
         MOBILE MENU DRAWER
         ========================================= -->
    <aside
      id="sideMenu"
      class="side-menu"
      aria-label="Menu"
      hidden
    >

      <div class="side-menu-header">

        <div class="brand">
          <div class="brand-logo">FT</div>

          <div class="brand-name">
            <span>Flick</span><strong>Tide</strong>
          </div>
        </div>

        <button
          type="button"
          id="closeMenuButton"
          aria-label="Close Menu"
        >
          ×
        </button>

      </div>


      <div class="side-menu-content">

        <!-- ভবিষ্যতে Menu items এখানে যুক্ত হবে -->

      </div>

    </aside>


    <!-- =========================================
         OVERLAY
         ========================================= -->
    <div
      id="appOverlay"
      class="app-overlay"
      hidden
    ></div>


  </div>


  <!-- =========================================
       JAVASCRIPT ENTRY
       =========================================

       এখানে এখন কোনো feature logic নেই।
       ভবিষ্যতে আলাদা JS modules এখান থেকে যুক্ত হবে।
       ========================================= -->

  <script type="module" src="js/app.js"></script>

</body>
</html>
